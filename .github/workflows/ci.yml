name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from the root package.json "packageManager" field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @caperjs/core lint

      - name: Typecheck
        run: pnpm --filter @caperjs/core exec tsc --noEmit -p tsconfig.json

      - name: Test
        run: pnpm --filter @caperjs/core test

      - name: Build framework + kitchen-sink
        run: pnpm kitchen-sink:build

      - name: Build plugin packages
        run: pnpm packages:build

      - name: Install Playwright Chromium
        run: pnpm --filter caper-kitchen-sink exec playwright install --with-deps chromium

      - name: Boot smoke test
        run: pnpm kitchen-sink:smoke
