<!doctype html>
<html lang="en">
  <head>
    <link href="/favicon.ico" rel="icon" type="image/ico" />
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport" />
    <meta content="yes" name="mobile-web-app-capable" />
    <meta content="yes" name="apple-mobile-web-app-capable" />
    <title>Caper - Examples</title>
    <style>
      @import url('./src/css/styles.css');
      @import url('../../packages/core/extras/css/loader.css');
    </style>
  </head>
  <body>
    <script type="module" src="src/index.ts" async defer></script>

    <!-- Top-left brand mark -->
    <a class="brand" href="https://github.com/anthonysapp/caper" target="_blank" rel="noopener">
      <img alt="Caper" class="brand-logo" src="/static/caper.svg" width="36" />
      <img alt="CAPER" class="brand-wordmark" src="/static/caper-text.svg" height="24" />
    </a>

    <!-- Canvas container — fills the viewport -->
    <div id="caper-game-container"></div>

    <!-- Scene reel — bottom drawer, horizontally scrollable -->
    <button id="reel-toggle" class="reel-toggle" aria-label="Toggle scene reel">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path
          class="reel-chevron"
          d="M2 5 L7 10 L12 5"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </button>
    <div id="reel" class="reel">
      <div class="reel-header">
        <div class="reel-search" id="search-bar">
          <input type="text" id="search-input" placeholder="Filter scenes…" autocomplete="off" />
          <span class="search-count" id="search-count"></span>
        </div>
        <div class="reel-meta" id="version-meta"></div>
      </div>
      <div class="reel-scroll">
        <nav class="reel-nav"></nav>
      </div>
    </div>
  </body>
</html>
