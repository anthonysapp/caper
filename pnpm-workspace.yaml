packages:
  - 'packages/*'
  - 'apps/kitchen-sink'

overrides:
  pixi.js: 8.23.0
  # klipp's optional React peer (>=19.2) is never used here (core entry only). Accept the React
  # already in the tree, so installing klipp does not add a second React and re-point @pixi/layout.
  '@pmndrs/klipp>react': '*'

peerDependencyRules:
  allowedVersions:
    'vite-plugin-pwa>vite': ^8.0.0

# pnpm 11 runs install scripts only for packages listed here.
allowBuilds:
  esbuild: true
  sharp: true
  '@ffmpeg-installer/darwin-arm64': true
  '@ffmpeg-installer/linux-x64': true
  cpu-features: false
  protobufjs: false

# @pixi/3d is younger than pnpm 11's minimum release age; allow the exact pin.
minimumReleaseAgeExclude:
  - '@pixi/3d@0.1.0'
